<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="description" content="Apple The Exchange TRX — AI Creative Studio">
<title>Apple Creative Studio</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f5f5f7;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.48}.app{width:min(100%,500px);height:100dvh;margin:auto;background:#fff;display:flex;flex-direction:column;border-inline:1px solid #e5e5e5;position:relative;overflow:hidden}header{height:58px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #eee;background:#fff}header strong{font-size:14px}header small{font-size:10px;color:#777}.main{flex:1;min-height:0;overflow:auto;padding:12px;background:#f5f5f7}.panel{background:#fff;border:1px solid #e5e5e5;border-radius:16px;padding:14px;margin-bottom:12px}.panel h2{font-size:14px;margin:0 0 4px}.muted{color:#777;font-size:11px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{border:1px solid #e5e5e5;border-radius:11px;padding:10px 13px;background:#fff;color:#171717;font-size:12px;font-weight:600}.btn.primary{background:#111;color:#fff;border-color:#111}.btn.subtle{background:#f5f5f5}.btn.block{width:100%}.btn.small{padding:7px 10px}.field{margin-top:12px}.field label{display:block;font-size:11px;font-weight:650;color:#555;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid #e5e5e5;border-radius:10px;padding:10px 11px;font-size:12px;background:#fff;color:#171717}.field textarea{min-height:76px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.template{width:100%;padding:12px;border:1px solid #e5e5e5;border-radius:12px;background:#fff;text-align:left;margin-top:8px}.template strong{display:block;font-size:12px}.template span{display:block;font-size:10px;color:#777;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.template.active{background:#171717;color:#fff;border-color:#171717}.template.active span{color:#ccc}.preview{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:12px;background:#eee}.empty{padding:34px 12px;text-align:center;color:#888;font-size:12px}.tabs{height:64px;flex:none;border-top:1px solid #e5e5e5;display:flex;justify-content:space-around;background:#fff;padding-bottom:env(safe-area-inset-bottom)}.tabs button{flex:1;border:0;background:transparent;color:#888;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.tabs button.active{color:#111;font-weight:700}.tabs b{font-size:17px;font-weight:500}.toast{position:absolute;z-index:5;top:12px;left:12px;right:12px;padding:11px 14px;border-radius:12px;background:#111;color:#fff;font-size:12px;box-shadow:0 6px 24px #0002}.toast.error{background:#fff0f0;color:#991b1b;border:1px solid #fecaca}.status{font-size:11px;padding:10px;border-radius:10px;background:#f5f5f5;margin-top:10px;white-space:pre-wrap}.status.error{background:#fff0f0;color:#991b1b}.image-card{margin-top:12px}.slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.slot{padding:12px 4px;border:1px solid #e5e5e5;border-radius:10px;background:white;font-size:11px}.slot.selected{background:#111;color:#fff;border-color:#111}.slot:disabled{text-decoration:line-through;background:#f4f4f4;color:#aaa}.record{display:flex;gap:10px;align-items:center;padding:9px;border:1px solid #eee;border-radius:12px;background:#fff;margin-top:8px;width:100%;text-align:left}.record img{width:54px;aspect-ratio:4/5;object-fit:cover;border-radius:7px;background:#eee}.record div{min-width:0}.record strong,.record span{display:block;overflow:hidden;text-overflow:ellipsis}.record strong{font-size:12px}.record span{font-size:10px;color:#888;margin-top:4px}.calendar-day{margin-top:16px}.calendar-day h3{font-size:12px}.calendar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.calendar-cell{aspect-ratio:1;border:0;background:#eee;overflow:hidden;padding:0;font-size:10px;color:#777}.calendar-cell img{width:100%;height:100%;object-fit:cover}.calendar-cell.filled{background:#222;color:white}.modal{position:absolute;inset:0;background:#0008;z-index:4;display:flex;align-items:flex-end}.sheet{background:white;border-radius:20px 20px 0 0;padding:18px;width:100%;max-height:85%;overflow:auto}.sheet h3{font-size:14px;margin:0}.actions{display:flex;gap:8px;margin-top:10px}.actions>*{flex:1}@media(min-width:700px){.app{height:100vh;box-shadow:0 0 0 1px #ddd}}
</style>
</head>
<body>
<div class="app">
<header><div><strong>Apple Creative Studio</strong><br><small>@appletheexchangetrx</small></div><button class="btn small subtle" id="refresh">Refresh</button></header>
<div id="toast" class="toast" hidden></div>
<main class="main" id="main" aria-live="polite"></main>
<nav class="tabs" aria-label="Main navigation">
<button data-tab="templates" class="active"><b>▦</b>Template</button>
<button data-tab="history"><b>◷</b>Jadwal</button>
<button data-tab="calendar"><b>▦</b>Calendar</button>
<button data-tab="settings"><b>⚙</b>Settings</button>
</nav>
<div id="modal-root"></div>
</div>
<script>
"use strict";
const API="https://jhpbtooefyzdndstlzva.supabase.co/functions/v1/crud-make-prompt";
const WEBHOOK="https://jhpbtooefyzdndstlzva.supabase.co/functions/v1/crud-make-webhook";
const LOGO="https://jhpbtooefyzdndstlzva.supabase.co/storage/v1/object/public/apple/logo.png";
const SLOTS=["09:00","13:00","19:00"];
const KEYS=["product","style","visual_style","headline","subheadline","feature_items","composition","background","typographhy","lighting"];
const LABELS={product:"Product",style:"Style",visual_style:"Visual Style",headline:"Headline",subheadline:"Subheadline",feature_items:"Feature Items",composition:"Composition",background:"Background",typographhy:"Typography",lighting:"Lighting"};
const state={tab:"templates",records:[],history:[],calendar:[],selected:null,vars:{},anonKey:"",logo:null,logoUrl:LOGO,imageData:null,imageMime:"image/png",imageUrl:"",busy:false,error:"",toastTimer:null,historySelected:null,calendarSelected:null};
const $=s=>document.querySelector(s);
const main=$("#main");
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function field(v){if(v==null)return "";return typeof v==="string"?v:JSON.stringify(v,null,2);}
function headers(json=false){const h={};if(json)h["Content-Type"]="application/json";if(state.anonKey){h.apikey=state.anonKey;h.Authorization="Bearer "+state.anonKey;}return h;}
async function request(url,opts={}){let r=await fetch(url,{...opts,headers:{...headers((opts.headers||{})["Content-Type"]==="application/json"),...(opts.headers||{})}});let raw=await r.text();let data={};try{data=raw?JSON.parse(raw):{};}catch{throw Error("Respons server bukan JSON (HTTP "+r.status+").");}if(!r.ok||data?.success===false||data?.error)throw Error(data.error||data.message||"HTTP "+r.status);return data;}
function toast(msg,error=false){const el=$("#toast");el.textContent=msg;el.className="toast"+(error?" error":"");el.hidden=false;clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>el.hidden=true,3800);}
function varsFrom(r){const v={};KEYS.forEach(k=>v[k]=field(k==="typographhy"?(r.typographhy??r.typography):r[k]));return v;}
function masterPrompt(v,logoInstruction=""){return `Create a premium Instagram Feed advertising design for @appletheexchangetrx.
Design a visually striking Apple product advertisement inspired by the clean, minimalist, premium aesthetic of Apple's official product campaigns, adapted for @appletheexchangetrx's Instagram branding.
${logoInstruction}
${KEYS.map(k=>k+"\n"+(v[k]||"")).join("\n")}
CREATIVE DIRECTION:
Create a premium product-focused Instagram advertisement. Make the product the main visual attraction; use elegant minimal composition, realistic materials, strong visual hierarchy, generous negative space and excellent mobile readability.
BRAND DIRECTION:
Communicate premium quality, innovation, trust and exclusivity.
OUTPUT REQUIREMENTS:
Instagram Feed, aspect ratio 4:5, resolution 1080 × 1350 px, premium commercial advertising quality, sharp details and refined typography.
IMPORTANT: Follow all variables precisely. Do not invent product specifications or promotional text. Render supplied text accurately.`;}
function nav(){document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab));}
function showError(msg){main.innerHTML='<section class="panel"><h2>Terjadi kendala</h2><p class="status error">'+esc(msg)+'</p><button class="btn primary block" id="retry">Coba lagi</button></section>';$("#retry").onclick=refreshTab;}
async function loadRecords(){const data=await request(API);if(!Array.isArray(data))throw Error("Format template tidak valid.");state.records=data.filter(x=>x?.is_ready===false);}
async function loadHistory(){const data=await request(API);if(!Array.isArray(data))throw Error("Format history tidak valid.");state.history=data.filter(x=>x?.is_ready===true);}
async function loadCalendar(){const data=await request(WEBHOOK+"/get");if(!Array.isArray(data?.data))throw Error("Format calendar tidak valid.");state.calendar=data.data;}
async function refreshTab(){try{main.innerHTML='<div class="empty">Memuat data…</div>';if(state.tab==="templates")await loadRecords();if(state.tab==="history")await loadHistory();if(state.tab==="calendar")await loadCalendar();render();}catch(e){showError(e.message);}}
function render(){nav();if(state.tab==="settings")return renderSettings();if(state.tab==="history")return renderHistory();if(state.tab==="calendar")return renderCalendar();renderTemplates();}
function renderTemplates(){
 if(state.selected){renderEditor();return;}
 main.innerHTML='<section class="panel"><div class="row"><div><h2>Creative Templates</h2><p class="muted">Pilih template untuk membuat iklan produk Instagram.</p></div><span class="muted">'+state.records.length+' templates</span></div><div id="templates"></div></section>';
 const list=$("#templates");
 if(!state.records.length){list.innerHTML='<div class="empty">Tidak ada template yang siap digunakan.</div>';return;}
 state.records.forEach(r=>{const b=document.createElement("button");b.className="template";b.innerHTML='<strong>'+esc(field(r.product)||"Untitled Product")+'</strong><span>'+esc(field(r.headline)||"Template iklan")+'</span>';b.onclick=()=>selectRecord(r);list.append(b);});
}
async function selectRecord(item){try{state.busy=true;state.error="";const r=await request(API+"?id="+encodeURIComponent(item.id)).catch(()=>item);state.selected=r;state.vars=varsFrom(r);state.imageData=null;state.imageUrl="";render();await generateImage();}catch(e){state.error=e.message;renderEditor();}}
function renderEditor(){
 const r=state.selected;
 main.innerHTML='<section class="panel"><div class="row"><div><h2>'+esc(field(r.product)||"Product Template")+'</h2><p class="muted">Template variables · Instagram 4:5</p></div><button class="btn small" id="back">← Back</button></div><div id="fields"></div><div class="field"><label>Brand logo (optional replacement)</label><input id="logo" type="file" accept="image/png,image/jpeg,image/webp"></div><button class="btn primary block" id="generate" style="margin-top:14px" '+(state.busy?"disabled":"")+'>Generate Image</button><div id="error"></div><div id="result"></div></section>';
 $("#back").onclick=()=>{state.selected=null;state.imageData=null;render();};
 const f=$("#fields");KEYS.forEach(k=>{const d=document.createElement("div");d.className="field";d.innerHTML='<label>'+LABELS[k]+'</label><textarea data-key="'+k+'">'+esc(state.vars[k]||"")+'</textarea>';f.append(d);});
 f.querySelectorAll("textarea").forEach(t=>t.oninput=()=>state.vars[t.dataset.key]=t.value);
 $("#logo").onchange=e=>{state.logo=e.target.files?.[0]||null;if(state.logo)toast("Brand logo dipilih.");};
 $("#generate").onclick=generateImage;
 renderResult();
}
function renderResult(){const e=$("#error"),r=$("#result");if(!e||!r)return;e.innerHTML=state.error?'<div class="status error">'+esc(state.error)+'</div><button class="btn small" id="retrygen">Retry</button>':"";if($("#retrygen"))$("#retrygen").onclick=generateImage;
 if(state.imageData){r.innerHTML='<div class="image-card"><img class="preview" src="data:'+state.imageMime+';base64,'+state.imageData+'" alt="Generated advertisement"><div class="actions"><button class="btn" id="download">Download</button><button class="btn" id="copyurl" '+(!state.imageUrl?"disabled":"")+'>Copy URL</button></div>'+(state.imageUrl?'<p class="status">Public URL<br>'+esc(state.imageUrl)+'</p>':"")+'</div>';$("#download").onclick=downloadImage;if($("#copyurl"))$("#copyurl").onclick=()=>navigator.clipboard.writeText(state.imageUrl).then(()=>toast("URL disalin."));}
}
async function fileBase64(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(String(fr.result).split(",")[1]);fr.onerror=reject;fr.readAsDataURL(file);});}
async function generateImage(){
 if(!state.selected)return;// Gemini Canvas provides native runtime authentication; no user API key is required.
 state.busy=true;state.error="";const btn=$("#generate");if(btn){btn.disabled=true;btn.textContent="Generating…";}renderResult();
 try{
  const logo=state.logo||await (async()=>{const r=await fetch(LOGO);if(!r.ok)throw Error("Brand logo tidak dapat dimuat.");return new File([await r.blob()],"brand-logo.png",{type:"image/png"});})();
  const logoData=await fileBase64(logo);
  const prompt=masterPrompt(state.vars,"brand_logo_placement: Use the supplied original logo exactly as provided. Preserve its shape, proportions and colors. Position it at the top-left corner.");
  const payload={contents:[{role:"user",parts:[{text:prompt},{inlineData:{mimeType:logo.type||"image/png",data:logoData}}]}],generationConfig:{responseModalities:["IMAGE"],imageConfig:{aspectRatio:"4:5"}}};
  const apiKey=""; // Keep empty for Gemini Canvas native authentication.
  const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key="+apiKey,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  const data=await res.json();if(!res.ok)throw Error(data?.error?.message||"Gemini image generation gagal (HTTP "+res.status+").");
  const part=data?.candidates?.[0]?.content?.parts?.find(x=>x.inlineData);if(!part?.inlineData?.data)throw Error("Gemini tidak mengembalikan gambar.");
  state.imageData=part.inlineData.data;state.imageMime=part.inlineData.mimeType||"image/png";renderResult();await uploadImage();
 }catch(e){state.error=e.message;toast(e.message,true);renderResult();}finally{state.busy=false;if($("#generate")){$("#generate").disabled=false;$("#generate").textContent="Generate Image";}}
}
async function uploadImage(){
 const ext=state.imageMime==="image/jpeg"?"jpg":state.imageMime==="image/webp"?"webp":"png";const blob=await (await fetch("data:"+state.imageMime+";base64,"+state.imageData)).blob();if(blob.size>10*1024*1024)throw Error("Ukuran gambar melebihi 10 MB.");
 const file=new File([blob],"apple-ad-"+Date.now()+"."+ext,{type:state.imageMime});const fd=new FormData();fd.append("file",file);
 const res=await fetch(API+"/upload",{method:"POST",headers:headers(),body:fd});const data=await res.json();if(!res.ok)throw Error(data.error||"Upload gambar gagal.");
 const url=data.image_url||data.publicUrl||data.public_url||data.url||data?.data?.image_url;if(!url)throw Error("URL publik tidak ditemukan pada respons upload.");state.imageUrl=url;
 const saved=await request(API+"?id="+encodeURIComponent(state.selected.id),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({image_url:url,is_ready:true})});
 toast("Gambar diunggah dan URL tersimpan.");renderResult();
}
function downloadImage(){if(!state.imageData)return;const a=document.createElement("a");a.href="data:"+state.imageMime+";base64,"+state.imageData;a.download="appletheexchangetrx-"+(state.selected?.id||"ad")+".png";a.click();}
function renderSettings(){
main.innerHTML='<section class="panel"><h2>Settings</h2><p class="muted">Gemini authentication disediakan oleh Gemini Canvas Native Runtime. Tidak diperlukan API Key manual.</p><div class="field"><label>Supabase Edge Function Anon Key (opsional jika endpoint publik)</label><input id="anon" type="password" autocomplete="off" placeholder="Supabase anon key"></div><button class="btn primary block" id="save-settings" style="margin-top:14px">Simpan untuk sesi ini</button><p class="status">Gemini API Key sengaja dikosongkan agar Canvas runtime dapat menyuntikkan autentikasi native. Aplikasi ini ditujukan untuk Gemini Canvas.</p></section><section class="panel"><h2>Brand identity</h2><p class="muted">@appletheexchangetrx · Instagram Feed · 4:5 · 1080 × 1350</p></section>';
$("#anon").value=state.anonKey;$("#save-settings").onclick=()=>{state.anonKey=$("#anon").value.trim();toast("Pengaturan disimpan untuk sesi ini.");};
}
function renderHistory(){main.innerHTML='<section class="panel"><div class="row"><div><h2>Jadwal</h2><p class="muted">'+state.history.length+' completed products</p></div><button class="btn small" id="reload">Refresh</button></div><div id="history-list"></div></section>';$("#reload").onclick=refreshTab;const box=$("#history-list");if(!state.history.length){box.innerHTML='<div class="empty">Belum ada completed products.</div>';return;}state.history.forEach(r=>{const b=document.createElement("button");b.className="record";b.innerHTML=(r.image_url?'<img src="'+esc(r.image_url)+'" alt="">':'<div style="width:54px"></div>')+'<div><strong>'+esc(field(r.product)||"Untitled Product")+'</strong><span>'+esc(field(r.caption)||"No caption")+'</span></div>';b.onclick=()=>openHistoryDetail(r);box.append(b);});}
function openHistoryDetail(r){state.historySelected=r;main.innerHTML='<section class="panel"><button class="btn small" id="backhist">← Kembali</button><h2 style="margin-top:14px">Detail Post</h2><p class="muted">'+esc(field(r.product))+'</p>'+(r.image_url?'<img class="preview" src="'+esc(r.image_url)+'" alt="">':'')+'<p style="font-size:12px;line-height:1.6">'+esc(field(r.caption)||"No caption")+'</p><button class="btn primary block" id="schedule" '+(!r.image_url||!r.caption?"disabled":"")+'>Jadwalkan</button></section>';$("#backhist").onclick=()=>{state.historySelected=null;renderHistory();};$("#schedule").onclick=()=>openSchedule(r);}
async function openSchedule(r){try{await loadCalendar();const occupied=state.calendar;const today=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Kuala_Lumpur"}).format(new Date());$("#modal-root").innerHTML='<div class="modal"><section class="sheet"><div class="row"><h3>Jadwalkan Post</h3><button class="btn small" id="closemodal">Tutup</button></div><div class="field"><label>Tanggal publikasi (MYT)</label><input type="date" id="schedule-date" min="'+today+'" value="'+today+'"></div><div class="slot-grid" id="slots"></div><div class="actions"><button class="btn primary" id="confirm-schedule" disabled>Konfirmasi Jadwal</button></div></section></div>';let chosen="";const draw=()=>{const date=$("#schedule-date").value;$("#slots").innerHTML=SLOTS.map(s=>{const used=occupied.some(x=>String(x.date||"").slice(0,10)===date&&String(x.time||"").slice(0,5)===s);return '<button class="slot" data-slot="'+s+'" '+(used?"disabled":"")+'>'+s+(used?" · Penuh":"")+'</button>';}).join("");$("#slots").querySelectorAll("button").forEach(b=>b.onclick=()=>{chosen=b.dataset.slot;$("#slots").querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x===b));$("#confirm-schedule").disabled=false;});};draw();$("#schedule-date").onchange=draw;$("#closemodal").onclick=()=>$("#modal-root").innerHTML="";$("#confirm-schedule").onclick=async()=>{try{const date=$("#schedule-date").value;const fresh=await request(WEBHOOK+"/get");if(fresh.data.some(x=>String(x.date||"").slice(0,10)===date&&String(x.time||"").slice(0,5)===chosen))throw Error("Slot baru saja terisi. Pilih slot lain.");await request(WEBHOOK+"/post",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image_url:r.image_url,caption:r.caption,date,time:chosen})});await request(API+"?id="+encodeURIComponent(r.id),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({image_url:null,caption:null})});$("#modal-root").innerHTML="";toast("Post berhasil dijadwalkan.");await Promise.all([loadHistory(),loadCalendar(),loadRecords()]);renderHistory();}catch(e){toast(e.message,true);}};}catch(e){toast(e.message,true);}}
function renderCalendar(){main.innerHTML='<section class="panel"><div class="row"><div><h2>Content Calendar</h2><p class="muted">3 daily slots · Kuala Lumpur time</p></div><button class="btn small" id="reloadcal">Refresh</button></div><div id="cal"></div></section>';$("#reloadcal").onclick=refreshTab;const box=$("#cal");if(!state.calendar.length){box.innerHTML='<div class="empty">Belum ada jadwal.</div>';return;}const dates=[...new Set(state.calendar.map(x=>String(x.date||"").slice(0,10)))].filter(Boolean).sort();dates.forEach(date=>{const day=document.createElement("section");day.className="calendar-day";day.innerHTML="<h3>"+esc(new Date(date+"T00:00:00").toLocaleDateString("en-MY",{weekday:"long",day:"numeric",month:"long",year:"numeric"}))+"</h3><div class=calendar-grid></div>";const grid=day.querySelector(".calendar-grid");SLOTS.forEach(slot=>{const r=state.calendar.find(x=>String(x.date||"").slice(0,10)===date&&String(x.time||"").slice(0,5)===slot);const b=document.createElement("button");b.className="calendar-cell"+(r?" filled":"");b.innerHTML=r?.image_url?'<img src="'+esc(r.image_url)+'" alt="">':slot+(r?"":" · Empty");b.disabled=!r;b.onclick=()=>openCalendarDetail(r);grid.append(b);});box.append(day);});}
function openCalendarDetail(r){main.innerHTML='<section class="panel"><button class="btn small" id="backcal">← Calendar</button><p class="muted" style="margin-top:14px">'+esc(String(r.date||"").slice(0,10))+' · '+esc(String(r.time||"").slice(0,5))+' MYT</p>'+(r.image_url?'<img class="preview" src="'+esc(r.image_url)+'" alt="">':'')+'<p style="font-size:12px;line-height:1.6">'+esc(field(r.caption))+'</p><button class="btn primary block" id="copycaption">Copy Caption</button></section>';$("#backcal").onclick=renderCalendar;$("#copycaption").onclick=()=>navigator.clipboard.writeText(field(r.caption)).then(()=>toast("Caption disalin."));}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.selected=null;state.historySelected=null;state.calendarSelected=null;render();refreshTab();});
$("#refresh").onclick=refreshTab;
render();refreshTab();
</script>
</body>
</html>
